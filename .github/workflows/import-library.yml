name: Import and publish DoLaby source
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA256: ad823c4dea328f11139974398d4a58fbd6d521f5ffaea361e5c79a52c4f9fcb1
    steps:
      - uses: actions/checkout@v6
      - name: Download the owner-supplied source archive
        run: |
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern DoLaby-Library-Source-v1.0.0.zip --dir "$RUNNER_TEMP/dolaby-source"
      - name: Verify and unpack the exact reviewed sources
        run: |
          python3 - <<'PY'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'dolaby-source/DoLaby-Library-Source-v1.0.0.zip'
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_SHA256'], 'Source checksum mismatch'
          allowed = {'assets','data','library','downloads','docs','qa','scripts','site-src','.github','README.md','site.config.json','.nojekyll','.gitignore'}
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'ZIP CRC failure'
              assert len(z.infolist()) == 979, 'Unexpected source membership'
              canonical = z.read('.github/workflows/pages.yml')
              assert (root / '.github/workflows/pages.yml').read_bytes() == canonical, 'Publish workflow must match the reviewed source'
              for item in z.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts, 'Unsafe archive path'
                  assert path.parts and (path.parts[0] in allowed or (len(path.parts) == 1 and path.suffix == '.html')), 'Unexpected source path'
                  assert not stat.S_ISLNK(item.external_attr >> 16), 'Symlink entry rejected'
                  if path.parts[0] == '.github':
                      assert item.filename == '.github/workflows/pages.yml', 'Unexpected workflow entry'
                      continue
                  destination = root.joinpath(*path.parts)
                  assert destination.resolve().is_relative_to(root), 'Path escaped workspace'
                  if item.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(z.read(item))
          print('Verified and imported 979 source entries; existing workflow preserved.')
          PY
      - name: Build and verify the complete library
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
          python3 scripts/prepare_site.py
      - name: Commit the complete editable sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete DoLaby design library and editable kits'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish the library
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish the complete source release
        run: gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --target "$(git rev-parse HEAD)" --latest
