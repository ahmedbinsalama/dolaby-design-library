name: Publish DoLaby Library
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/**"
      - "data/**"
      - "site-src/**"
      - "library/**"
      - "scripts/**"
      - "docs/**"
      - "downloads/**"
      - "site.config.json"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build library pages and file index
        run: python3 scripts/build.py
      - name: Check links and preserved sources
        run: python3 scripts/check.py
      - name: Prepare static site
        run: python3 scripts/prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
