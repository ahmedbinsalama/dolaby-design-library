<!doctype html><html lang="ar"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoLaby · social motion sources</title><link rel="stylesheet" href="../../01_SHARED_FOUNDATIONS/fonts-and-licenses/fonts.css"><link rel="stylesheet" href="../../01_SHARED_FOUNDATIONS/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:#F3E9D8;color:#151D2B;font-family:Cairo,sans-serif}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:20px;background:white}button,select{background:#FCF8F0;border:1px solid #123B32;border-radius:8px;min-height:44px;padding:8px 18px;font:inherit;color:#151D2B}button:focus-visible,select:focus-visible{outline:3px solid #123B32;outline-offset:3px}#scene{position:relative;width:1080px;height:1920px;background:#FCF8F0;overflow:hidden;padding:190px 100px 300px;text-align:center}#logo{width:350px;height:110px;object-fit:contain;display:block;margin:0 auto 120px}#line{height:1px;background:#B69A62;margin-bottom:75px}h1{font-size:94px;line-height:1.4;font-weight:600;margin:0 0 30px}p{font-size:38px;line-height:1.8;margin:0}#laby{width:430px;height:650px;object-fit:contain;margin:35px auto 50px}#signature{font-family:'Cormorant Garamond',serif;font-size:57px;line-height:1.15;direction:ltr;color:#382019}#note{position:absolute;bottom:230px;left:110px;right:110px;font-size:25px}body.clean .controls{display:none}body.clean{width:1080px}#status{padding:8px;font-size:14px}.clean #status{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><body><div class="controls"><label>المشهد <select id="kind"><option value="intro">افتتاحية</option><option value="outro">خاتمة</option></select></label><button id="play">تشغيل / إيقاف</button><button id="replay">إعادة</button><button id="skip">تخطي للنهاية</button><a href="../index.html">المكتبة</a></div><div id="status" role="status" aria-live="polite">مصدر حركة اجتماعية صامتة · لا تسجيل فيديو داخل المنتج</div><main id="scene" data-state="paused" aria-label="DoLaby social motion graphic"><img id="logo" src="../../01_SHARED_FOUNDATIONS/canonical-logo/logo-lockup.svg" alt="DoLaby"><div id="line"></div><h1 id="headline" contenteditable="true">من ملابسك.<br>أكثر من احتمال.</h1><p id="subline" contenteditable="true">فكرة ليومك، والاختيار لك.</p><img id="laby" src="../../01_SHARED_FOUNDATIONS/canonical-laby/laby-seated.svg" alt="لابي في وضع الجلوس"><div id="signature" contenteditable="true">just say dolaby<br>and get ready with laby</div><p id="note" contenteditable="true">رسوم توضيحية لمفهوم قيد التطوير</p></main><script>
const q=new URLSearchParams(location.search);document.body.classList.toggle('clean',q.get('clean')==='1');let kind=q.get('kind')||'intro',time=0,running=false,last=0;const duration=4,reduce=matchMedia('(prefers-reduced-motion:reduce)');const scene=document.querySelector('#scene');const headline=document.querySelector('#headline'),sub=document.querySelector('#subline'),laby=document.querySelector('#laby'),logo=document.querySelector('#logo'),signature=document.querySelector('#signature');
function choose(){document.querySelector('#kind').value=kind;if(kind==='outro'){headline.innerHTML='اقتراح من لابي.<br>وقرار منك.';sub.textContent='احفظ الفكرة أو عدّلها لتناسبك.';}else{headline.innerHTML='من ملابسك.<br>أكثر من احتمال.';sub.textContent='فكرة ليومك، والاختيار لك.';}}
const clamp=x=>Math.max(0,Math.min(1,x));function paint(){const t=reduce.matches?duration:time;logo.style.opacity=1;headline.style.opacity=clamp((t-.15)/.65);sub.style.opacity=clamp((t-.7)/.65);laby.style.opacity=clamp((t-1.1)/.9);signature.style.opacity=clamp((t-1.8)/.7);scene.dataset.time=time.toFixed(3);scene.dataset.state=running?'playing':time>=duration?'complete':'paused';}
function tick(now){if(running){if(last)time=Math.min(duration,time+(now-last)/1000);if(time>=duration)running=false;paint();}last=now;requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{if(reduce.matches){time=duration;running=false}else{if(time>=duration)time=0;running=!running}last=0;paint()};document.querySelector('#replay').onclick=()=>{time=0;running=!reduce.matches;last=0;paint()};document.querySelector('#skip').onclick=()=>{time=duration;running=false;paint()};document.querySelector('#kind').onchange=e=>{kind=e.target.value;time=0;running=false;choose();paint()};document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;paint()}});reduce.addEventListener('change',()=>{running=false;time=duration;paint()});choose();if(q.has('t'))time=Math.max(0,Math.min(duration,Number(q.get('t'))));else time=duration;paint();requestAnimationFrame(tick);window.SOCIAL_MOTION_READY=true;
</script></body></html>
