<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880"><style>text{font-family:Arial,sans-serif;fill:#151D2B}.title{font-size:30px}.label{font-size:16px}.small{font-size:13px}.box{fill:#FCF8F0;stroke:#123B32;stroke-width:1.5}.edge{fill:none;stroke:#123B32;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8" fill="#123B32"/></marker></defs><rect width="1400" height="880" fill="#F3E9D8"/><text x="50" y="62" class="title">DoLaby / Experience architecture</text><text x="50" y="93" class="small">Editable vector map • local design prototype • no live AI, identity or merchant integration</text><g id="S01"><rect class="box" x="50" y="145" width="260" height="110" rx="12"/><text x="70" y="182" class="small">S01</text><text x="70" y="217" class="label">Honest landing</text></g><g id="S02"><rect class="box" x="260" y="145" width="260" height="110" rx="12"/><text x="280" y="182" class="small">S02</text><text x="280" y="217" class="label">Context</text></g><g id="S03–S05"><rect class="box" x="470" y="145" width="260" height="110" rx="12"/><text x="490" y="182" class="small">S03–S05</text><text x="490" y="217" class="label">Input / correct / clarify</text></g><g id="S06–S07"><rect class="box" x="740" y="145" width="260" height="110" rx="12"/><text x="760" y="182" class="small">S06–S07</text><text x="760" y="217" class="label">Example / suggestions</text></g><g id="S08–S09"><rect class="box" x="1050" y="145" width="260" height="110" rx="12"/><text x="1070" y="182" class="small">S08–S09</text><text x="1070" y="217" class="label">Swap / explain</text></g><g id="S12"><rect class="box" x="740" y="320" width="260" height="110" rx="12"/><text x="760" y="357" class="small">S12 → S11</text><text x="760" y="392" class="label">Account at save / ideas</text></g><g id="S10"><rect class="box" x="1050" y="320" width="260" height="110" rx="12"/><text x="1070" y="357" class="small">S10 / S13</text><text x="1070" y="392" class="label">Wardrobe / preferences</text></g><g id="S14"><rect class="box" x="50" y="510" width="260" height="110" rx="12"/><text x="70" y="547" class="small">S14 / P3</text><text x="70" y="582" class="label">Consent / deletion</text></g><g id="S15–S16"><rect class="box" x="390" y="510" width="260" height="110" rx="12"/><text x="410" y="547" class="small">S15–S16 / P2</text><text x="410" y="582" class="label">Optional merchant exit</text></g><g id="S18–S19"><rect class="box" x="800" y="510" width="260" height="110" rx="12"/><text x="820" y="547" class="small">S18–S19 / P4</text><text x="820" y="582" class="label">Merchant interest</text></g><g id="S17"><rect class="box" x="50" y="710" width="260" height="110" rx="12"/><text x="70" y="747" class="small">S17</text><text x="70" y="782" class="label">Recoverable failure</text></g><g id="S20–S22"><rect class="box" x="800" y="710" width="260" height="110" rx="12"/><text x="820" y="747" class="small">S20–S22 / P5</text><text x="820" y="782" class="label">Admin / records / local draft</text></g><path class="edge" d="M310 200h-50"/><path class="edge" d="M520 200h-50"/><path class="edge" d="M730 200h10"/><path class="edge" d="M1000 200h50"/><path class="edge" d="M870 255v65"/><path class="edge" d="M1180 255v65"/><path class="edge" d="M390 565H310"/><path class="edge" d="M520 620v45H180v45"/><path class="edge" d="M180 710V620"/><path class="edge" d="M930 620v90"/><path class="edge" d="M870 430v36H520v44"/><text x="50" y="850" class="small">Source: shared editable app.js, 22 screen types; state-transitions.csv provides events, failure and recovery.</text></svg>